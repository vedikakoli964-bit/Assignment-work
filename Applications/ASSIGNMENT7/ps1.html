<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🛍️ ShopEase</h2>
        <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <section class="hero">
        <h1>Discover Your Next Favorite</h1>
        <p>Explore products and shop your favorites.</p>
    </section>

    <section class="controls">
        <input type="text" id="search" placeholder="Search products...">

        <select id="category">
            <option value="all">All Categories</option>
        </select>

        <select id="sort">
            <option value="default">Sort By</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
        </select>
    </section>

    <p id="message">Loading products...</p>

    <section id="products" class="product-grid"></section>

    <button id="loadMore">Load More</button>

    <div id="cartPanel" class="cart-panel">
        <div class="cart-header">
            <h2>My Cart</h2>
            <button id="closeCart">✖</button>
        </div>

        <div id="cartItems"></div>

        <h3>Total: <span id="cartTotal">$0.00</span></h3>

        <button id="clearCart" class="clear-btn">Clear Cart</button>
    </div>

    <div id="overlay"></div>

    <footer>
        <p>ShopEase ©️ 2026 | Created using HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<script src="./ps1.js"></script>
